aid: uspl-wrogn
name: USPL Wrogn
description: >-
  USPL (Universal Sportsbiz Pvt. Ltd.) is an Accel-backed Indian
  celebrity-fashion company whose flagship brand Wrogn — founded in 2014 by
  Anjana and Vikram Reddy and co-created with cricketer Virat Kohli — sells
  men's casual wear, footwear, and accessories at wrogn.com
  (usplworld.com redirects there). The store runs on Shopify and exposes a
  genuinely agent-ready commerce surface: a public storefront MCP server at
  /api/mcp, a Universal Commerce Protocol merchant profile at
  /.well-known/ucp with a UCP MCP endpoint, published agent instructions at
  /agents.md and /llms.txt, Shopify Customer Accounts OIDC discovery on its
  own host, and unauthenticated product JSON endpoints.
